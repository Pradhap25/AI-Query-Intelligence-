<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Query Intelligence</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
      padding: 14px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
    }
    .title {
      font-weight: 600;
      font-size: 13px;
    }
    .status-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .dot.paused {
      background: #ef4444;
    }
    .dot.warning {
      background: #f59e0b;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
    }
    .btn {
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      margin-bottom: 8px;
    }
    .btn-toggle {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
    }
    .btn-toggle:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .btn-toggle.paused {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .btn-settings {
      background: transparent;
      border-color: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
    }
    .btn-settings:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
    }
    .shortcut-hint {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
    kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 1px 4px;
      font-family: inherit;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-group">
      <div class="logo-badge">QI</div>
      <span class="title">Query Intelligence</span>
    </div>
    <span class="badge" id="popup-mode-badge">LOCAL</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color: #94a3b8;">Extension Status</span>
      <div class="status-indicator">
        <div class="dot" id="popup-status-dot"></div>
        <span id="popup-status-text" style="font-weight: 500;">Active</span>
      </div>
    </div>
    <div class="status-row">
      <span style="color: #94a3b8;">Provider</span>
      <span id="popup-provider-name" style="font-weight: 500;">Ollama</span>
    </div>
    <div class="status-row">
      <span style="color: #94a3b8;">Model</span>
      <span id="popup-model-name" style="font-family: monospace; font-size: 11px;">qwen2.5:14b</span>
    </div>
  </div>

  <button class="btn btn-toggle" id="popup-toggle-pause-btn">
    <span id="popup-pause-btn-text">Pause Extension</span>
  </button>

  <button class="btn btn-settings" id="popup-open-settings-btn">
    Settings & History
  </button>

  <div class="shortcut-hint">
    Trigger: <kbd>Ctrl+Shift+Space</kbd>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
